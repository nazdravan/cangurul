name: Release

# Push pe ramura `release` → build pentru toate platformele → draft GitHub Release
# „Cangurul v<versiune>” (tag v<versiune>) cu SHA256SUMS.txt. Draft-ul se publică manual.
# Pornit manual (workflow_dispatch) pe altă ramură: doar build și teste, nu publică nimic.
# Pașii sunt descriși în docs/releasing.md.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Versiune pentru o rulare de test, de ex. 3.1.0-rc.1 (gol: din Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    timeout-minutes: 10
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Citește versiunea
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::„$v” nu este o versiune de forma 1.2.3 sau 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### Cangurul v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      # Un release publicat nu se suprascrie: oprim totul înainte de build-urile lungi.
      - name: Verifică dacă versiunea e deja publicată
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" && [ "$draft" != "true" ]; then
            echo "::error::Release-ul v$VERSION este deja publicat. Mărește versiunea (packaging/version.sh set ...) înainte de push pe release."
            exit 1
          fi

  test:
    timeout-minutes: 30
    name: teste
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependențe de sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
      - run: cargo test --locked

  linux:
    timeout-minutes: 45
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependențe de sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux
      - name: Aplică versiunea de test
        if: inputs.version != ''
        run: packaging/version.sh set "$VERSION"
      - run: packaging/linux/package.sh
      - run: packaging/linux/appimage.sh
      - run: packaging/linux/deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  windows:
    timeout-minutes: 60
    name: Windows 10/11 ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Aplică versiunea de test
        if: inputs.version != ''
        shell: bash
        run: packaging/version.sh set "$VERSION"
      - name: Build și arhivă
        shell: pwsh
        run: packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  windows7:
    timeout-minutes: 90
    name: Windows 7+ x86
    needs: version
    runs-on: ubuntu-latest
    # Același mediu în care build-ul a fost testat local: Arch cu mingw-w64-gcc.
    container: archlinux:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Dependențe de sistem
        run: pacman -Syu --noconfirm --needed gcc mingw-w64-gcc p7zip zstd rustup git curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Aplică versiunea de test
        if: inputs.version != ''
        run: |
          rustup default stable
          packaging/version.sh set "$VERSION"
      - run: packaging/windows7/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows7-x86
          path: dist/release/*
          if-no-files-found: error

  release:
    timeout-minutes: 10
    name: Draft GitHub Release
    # Doar de pe ramura release; rulările de test se opresc după build.
    if: github.ref == 'refs/heads/release' && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [version, test, linux, windows, windows7]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Sume de control
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Creează sau actualizează draft-ul
        working-directory: artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          title="Cangurul v$VERSION"
          pre=()
          if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release-ul $tag este deja publicat. Mărește versiunea (packaging/version.sh set ...) înainte de push pe release."
              exit 1
            fi
            echo "Actualizez draft-ul $tag: îi înlocuiesc fișierele"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creez draft-ul $tag"
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
          fi
          {
            echo "Draft **$title** la \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
