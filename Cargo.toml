[package]
name = "cangurul"
version = "3.0.6"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["accessibility"]
# Suport pentru cititoare de ecran. Pe Windows îl aduce o bibliotecă ce cere
# Windows 8+, de aceea build-ul pentru Windows 7 se face fără el.
accessibility = ["eframe/accesskit"]

[dependencies]
app-update = { git = "https://github.com/nazdravan/app-update", rev = "2bd753dd0e53524a5aabc2b244b06569b9050386" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
encoding_rs = "0.8.42"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
